# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Garden Digital
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-71RJ704J8T
  locale: es-ES
  baseUrl: garden.nuclidigital.com
  ignorePatterns:
    - private
    - templates
    # Bases, vocabulario y gobernanza son herramientas del Vault; no deben
    # aparecer como contenido editorial ni en las entradas recientes públicas.
    - governance
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # `title` solo se usa en el logotipo «Garden Digital»; Quartz carga un
      # subconjunto de Fraunces con esos caracteres, la misma serif de
      # nuclidigital.com.
      title: Fraunces
      # Literata en titulares y cuerpo: TypeTogether la desarrolló durante más
      # de un año probándola para lectura extensa en pantalla (es la fuente de
      # Google Play Books). No existe «la fuente más legible» —la investigación
      # dice que la mejor depende de cada lector—, así que se elige una diseñada
      # para este uso y se cuidan las palancas que sí funcionan a nivel de grupo:
      # tamaño, interlineado y ancho de línea.
      header: Literata
      body: Literata
      # JetBrains Mono está hecha para leer código en IDE y terminal: altura de
      # x mayor y formas inconfundibles entre 0/O, 1/l/I. Marca la diferencia
      # entre código y prosa, que es justo lo que se busca.
      code: JetBrains Mono
    # El sitio es solo oscuro. Quartz emite `lightMode` en `:root` y `darkMode`
    # en `:root[saved-theme="dark"]`; al ser idénticos, el tema no depende de que
    # ese atributo llegue a existir (el plugin `darkmode` está desactivado y
    # nadie lo escribe). Contrastes verificados sobre Polar Night.
    colors:
      lightMode: &nordDark
        light: "#2e3440" # nord0, superficie de lectura
        lightgray: "#3b4252" # nord1, raíles y fondo de código
        gray: "#d8dee9" # nord4, texto apagado — 9.25:1
        darkgray: "#e5e9f0" # nord5, texto de cuerpo — 10.26:1
        dark: "#eceff4" # nord6, titulares — 10.84:1
        # Frost nord8 aclarado: los enlaces internos van sobre `highlight`
        # (#434c5e) y con #88c0d0 se quedaban en 4.31:1.
        secondary: "#96cad8" # 4.82:1 sobre highlight, 6.98:1 sobre el fondo
        tertiary: "#ebcb8b" # Aurora amarillo — 8.00:1
        highlight: "#434c5e"
        # Marcador sólido: en oscuro, un velo translúcido dejaba el texto claro
        # en 1.28:1. `custom.scss` le pone encima texto Polar Night (8.00:1).
        textHighlight: "#ebcb8b"
      darkMode: *nordDark
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        # Shiki elige según el tema del documento; con uno solo, ambos son Nord.
        light: nord
        dark: nord
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      # Mermaid nativo de Quartz: solo carga el módulo en páginas que contienen
      # diagramas, en vez de incluir la librería completa en todo el sitio.
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      # Evita la caja vacía en páginas sin encabezados, como la portada.
      condition: has-toc
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  # Desactivado: este plugin no lee `theme.typography`, sino sus propias
  # opciones, y sin ellas emitía los valores por defecto de Quartz. Eso suponía
  # (a) una segunda hoja de Google Fonts descargando Schibsted Grotesk, Source
  # Sans Pro e IBM Plex Mono, que ya no usa nadie, y (b) una regla sin capa
  # `h1..h6 { font-family: Schibsted Grotesk }` que ganaba a `--headerFont` y
  # dejaba los titulares en una fuente no descargada. Sus variables
  # (`--font-text`, `--h1-font`…) no las consume nada. `theme.typography` y
  # `Head.tsx` ya emiten enlaces y variables.
  - source: github:quartz-community/fonts
    enabled: false
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      # El índice JSON continúa siendo nativo. Sitemap y RSS los emite GardenSeo
      # para excluir páginas virtuales débiles y limitar el feed a notas reales.
      enableSiteMap: false
      enableRSS: false
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      # `areas` contiene páginas virtuales generadas por Quartz para el segundo
      # menú; no es una carpeta editorial del vault y no pertenece al árbol.
      filterFn: '(node) => node.slugSegment !== "tags" && node.slugSegment !== "areas"'
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  # La portada trae su propio titular y no tiene fechas: el título del artículo
  # y los metadatos solo estorban ahí.
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  # Sustituido por `quartz/components/SiteBrand.tsx`, que pinta el símbolo y las
  # dos mitades del logotipo. El plugin solo sabe emitir texto plano.
  - source: github:quartz-community/page-title
    enabled: false
    layout:
      position: left
      priority: 10
  # Sitio solo oscuro: sin conmutador no hay nada que alternar.
  - source: github:quartz-community/darkmode
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      # El plugin rotula la raíz como «Home» aunque el sitio esté en español.
      rootName: Inicio
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: nuclidigital/garden
        repoId: R_kgDOTUd3kw
        category: Announcements
        categoryId: DIC_kwDOTUd3k84DC4Wx
        mapping: pathname
        strict: true
        reactionsEnabled: true
        inputPosition: bottom
        # Giscus decide con el atributo `saved-theme`, que ya nadie escribe, así
        # que las dos ramas apuntan al mismo tema. Además pasan a usar el CSS
        # Nord de `quartz/static/giscus/`, que se emitía pero no se aplicaba:
        # la configuración anterior nombraba los temas integrados de Giscus.
        lightTheme: https://garden.nuclidigital.com/static/giscus/dark.css
        darkTheme: https://garden.nuclidigital.com/static/giscus/dark.css
        lang: es
    layout:
      position: afterBody
      priority: 30
      condition: not-index
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Roger Gibaja: /sobre-mi
        Nucli Digital: https://nuclidigital.com
        Garden source: https://github.com/nuclidigital/garden
        Configuración de cookies: "#cookie-settings"
    layout:
      position: footer
      priority: 50
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Entradas recientes
      limit: 5
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 40
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        # `tags` sale de aquí: el plugin `tag-list` ya las pinta justo debajo y
        # aparecían dos veces en cada nota.
        - description
        - space
        - area
        - kind
        - project
        - season
        - phase
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
